<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

  <button class="theme-toggle quiet" type="button" id="theme-toggle" aria-label="Switch between light and dark">
    <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5 8.6 8.6 0 1 0 20.5 14.8Z"></path>
    </svg>
    <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <line x1="12" y1="2" x2="12" y2="4.5"></line>
      <line x1="12" y1="19.5" x2="12" y2="22"></line>
      <line x1="2" y1="12" x2="4.5" y2="12"></line>
      <line x1="19.5" y1="12" x2="22" y2="12"></line>
      <line x1="5.2" y1="5.2" x2="7" y2="7"></line>
      <line x1="17" y1="17" x2="18.8" y2="18.8"></line>
      <line x1="5.2" y1="18.8" x2="7" y2="17"></line>
      <line x1="17" y1="7" x2="18.8" y2="5.2"></line>
    </svg>
  </button>
</header>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var current = root.getAttribute('data-theme');
      if (!current) {
        current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('anaphors-theme', next); } catch (e) {}
    });
  })();
</script>
